<div id="toast-root">
  @for (t of toastService.toasts(); track t.id) {
    <div class="toast" [class.success]="t.type === 'success'" [class.error]="t.type === 'error'" [class.info]="t.type === 'info'" [class.leaving]="t.leaving">
      <span class="toast-dot"></span>
      <span>{{ t.text }}</span>
    </div>
  }
</div>
