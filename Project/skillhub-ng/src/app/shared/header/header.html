<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" [routerLink]="brandLink"><span class="brand-mark">S</span> SkillHub <span class="brand-sub">{{ roleLabel }}</span></a>
    <div class="nav-actions">
      <button class="btn btn-icon btn-ghost" (click)="themeService.toggle()" aria-label="Toggle theme">
        @if (themeService.theme() === 'dark') {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        } @else {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        }
      </button>

      @if (showProfileLink) {
        <div class="user-menu-wrap">
          <button class="user-trigger" (click)="toggleMenu()">
            <span class="avatar" style="width:26px;height:26px;font-size:10px;">
              @if (avatarUrl) { <img [src]="avatarUrl" alt=""> } @else { {{ initials }} }
            </span>
            <span class="name">{{ firstName }}</span>
          </button>
          <div class="user-menu" [class.open]="menuOpen">
            <button routerLink="/profile" (click)="closeMenu()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
              My profile
            </button>
            <hr>
            <button class="danger" (click)="logout()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
              Log out
            </button>
          </div>
        </div>
      } @else {
        <button class="btn btn-ghost btn-sm" (click)="logout()">Log out</button>
      }
    </div>
  </div>
</div>
