<td>
  <div class="cell-name">
    @if (coverUrl; as url) {
      <div class="row-cover" [style.background-image]="'url(' + url + ')'"></div>
    } @else {
      <div class="row-cover" [style.background]="coverColors.bg" [style.color]="coverColors.fg" [innerHTML]="coverIcon"></div>
    }
    <div>
      <div style="font-weight:600">{{ course().title }}</div>
      <div class="muted" style="font-size:12.5px; font-weight:400;">{{ course().instructor }}</div>
    </div>
  </div>
</td>
<td>
  <span class="pill" [style.background]="coverColors.bg" [style.color]="coverColors.fg">
    {{ capitalize(course().category) }}
  </span>
</td>
<td>
  <span class="level-dots">
    @for (on of dots; track $index) { <span [class.on]="on"></span> }
  </span>
  <span class="level-label">{{ capitalize(course().level) }}</span>
</td>
<td>
  <span class="price-tag" style="font-size:15px;">EGP {{ course().price }}</span>
</td>
<td>
  <div class="row gap-8">
    <button type="button" class="action-icon-btn edit" title="Edit" (click)="edit()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
    </button>
    <button type="button" class="action-icon-btn danger" title="Delete" (click)="delete()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg>
    </button>
  </div>
</td>
