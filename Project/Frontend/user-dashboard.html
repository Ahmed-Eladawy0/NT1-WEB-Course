<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillHub — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .filters-bar{
    display:flex; flex-wrap:wrap; gap:12px; align-items:center;
    padding:16px 20px; margin:24px 0;
  }
  .filters-bar .input-icon-wrap{ flex:1; min-width:220px; }
  .filters-bar select, .filters-bar .price-input{ width:180px; }
  .results-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px; padding:0 2px;
  }
  .courses-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:18px;
  }
  .course-card{
    padding:20px; display:flex; flex-direction:column; gap:10px;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .course-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:var(--border-strong); }
  .course-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .course-title{ font-size:16.5px; font-weight:700; line-height:1.3; }
  .course-instructor{ font-size:13px; color:var(--ink-soft); }
  .course-meta{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
  .course-meta-left{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-soft); }
  .course-footer{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; gap:10px; }
  .enrolled-chip{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600;
    color:var(--green); background:var(--green-soft); padding:9px 14px; border-radius:var(--radius-sm);
    width:100%; justify-content:center;
  }
  .skeleton-card{ height:172px; }

  .user-menu-wrap{ position:relative; }
  .user-menu{
    position:absolute; top:calc(100% + 10px); right:0; min-width:190px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    box-shadow:var(--shadow-lg); padding:6px; display:none; z-index:60;
  }
  .user-menu.open{ display:block; }
  .user-menu button{
    width:100%; text-align:left; background:none; border:none; padding:9px 11px; border-radius:8px;
    font-size:14px; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:9px;
  }
  .user-menu button:hover{ background:var(--surface-raised); }
  .user-menu .danger{ color:var(--red); }
  .user-menu hr{ border:none; border-top:1px solid var(--border); margin:5px 2px; }
  .user-trigger{
    display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--border);
    padding:5px 12px 5px 5px; border-radius:999px; cursor:pointer;
  }
  .user-trigger span{ font-size:13.5px; font-weight:600; }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="user-dashboard.html">
        <span class="brand-mark">◆</span> SkillHub <span class="brand-sub">learner</span>
      </a>
      <div class="nav-actions">
        <button class="btn btn-icon btn-ghost" onclick="toggleTheme()" aria-label="Toggle theme" data-theme-icon></button>
        <div class="user-menu-wrap">
          <button class="user-trigger" id="user-trigger" onclick="toggleUserMenu()">
            <span id="user-avatar"></span>
            <span id="user-name-short">Account</span>
          </button>
          <div class="user-menu" id="user-menu">
            <button onclick="window.location.href='profile.html'">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
              My profile
            </button>
            <hr>
            <button class="danger" onclick="logout()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
              Log out
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container" style="flex:1; padding-bottom:60px;">
    <div style="margin-top:32px;">
      <h1 id="welcome-msg" style="font-size:26px;">Welcome back</h1>
      <p class="muted" style="margin-top:4px;">Find your next skill — filter by title, category, or budget.</p>
    </div>

    <div class="card filters-bar">
      <div class="input-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="input" type="text" id="search-title" placeholder="Search courses by title..." oninput="filterCourses()">
      </div>
      <select class="input" id="filter-category" onchange="filterCourses()">
        <option value="">All categories</option>
      </select>
      <input class="input price-input" type="number" id="max-price" placeholder="Max price (EGP)" oninput="filterCourses()">
      <button class="btn btn-ghost btn-sm" onclick="clearFilters()">Clear</button>
    </div>

    <div class="results-row">
      <span class="muted" id="results-count" style="font-size:13.5px;"></span>
    </div>

    <div id="courses-container" class="courses-grid"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
  const user = requireUser();
  if (user) {
    document.getElementById('welcome-msg').textContent = `Welcome, ${user.name.split(' ')[0]}`;
    document.getElementById('user-name-short').textContent = user.name.split(' ')[0];
    document.getElementById('user-avatar').outerHTML = avatarHtml(user, 26).replace('class="avatar"', 'class="avatar" id="user-avatar"');
  }

  function toggleUserMenu() {
    document.getElementById('user-menu').classList.toggle('open');
  }
  document.addEventListener('click', (e) => {
    const wrap = document.querySelector('.user-menu-wrap');
    if (wrap && !wrap.contains(e.target)) document.getElementById('user-menu').classList.remove('open');
  });

  let allCourses = [];
  let enrolledSet = new Set((user && user.enrolledCourses) || []);

  async function enrollCourse(courseTitle, btn) {
    const currentUser = JSON.parse(localStorage.getItem('user'));
    setButtonLoading(btn, true);
    try {
      const res = await fetch(`${API_BASE}/auth/users/${currentUser.id}/enroll`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ courseTitle })
      });
      const data = await res.json();
      if (data.status === 'success') {
        localStorage.setItem('user', JSON.stringify(data.data.user));
        enrolledSet = new Set(data.data.user.enrolledCourses || []);
        toast(`Enrolled in "${courseTitle}"`, 'success');
        displayCourses(applyFilters(allCourses));
      } else {
        toast(data.message || 'Failed to enroll', 'error');
        setButtonLoading(btn, false);
      }
    } catch (err) {
      console.error('Error enrolling course:', err);
      toast('Could not reach the server.', 'error');
      setButtonLoading(btn, false);
    }
  }

  function populateCategories(courses) {
    const select = document.getElementById('filter-category');
    const existing = new Set(Array.from(select.options).map(o => o.value).filter(Boolean));
    [...new Set(courses.map(c => c.category).filter(Boolean))].sort().forEach(cat => {
      if (!existing.has(cat)) {
        const opt = document.createElement('option');
        opt.value = cat; opt.textContent = cat;
        select.appendChild(opt);
      }
    });
  }

  function renderSkeleton() {
    const container = document.getElementById('courses-container');
    container.innerHTML = Array.from({ length: 6 }).map(() => `<div class="card course-card skeleton-card"><div class="skeleton" style="height:16px;width:70%"></div><div class="skeleton" style="height:12px;width:40%"></div><div class="skeleton" style="height:12px;width:90%;margin-top:10px"></div><div class="skeleton" style="height:34px;width:100%;margin-top:12px"></div></div>`).join('');
  }

  async function fetchCourses() {
    renderSkeleton();
    try {
      const res = await fetch(`${API_BASE}/courses`);
      const data = await res.json();
      allCourses = data.data.courses;
      populateCategories(allCourses);
      displayCourses(allCourses);
    } catch (err) {
      console.error('Error fetching courses:', err);
      toast('Could not load courses. Is the backend running?', 'error');
      document.getElementById('courses-container').innerHTML = '';
    }
  }

  function displayCourses(courses) {
    const container = document.getElementById('courses-container');
    document.getElementById('results-count').textContent = `${courses.length} course${courses.length === 1 ? '' : 's'} found`;
    container.innerHTML = '';
    if (courses.length === 0) {
      container.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="empty-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </div>
          <h4>No courses match your filters</h4>
          <p>Try widening your search or clearing a filter.</p>
        </div>`;
      return;
    }
    courses.forEach((c, i) => {
      const isEnrolled = enrolledSet.has(c.title);
      const card = document.createElement('div');
      card.className = 'card course-card fade-up';
      card.style.animationDelay = `${Math.min(i, 8) * 40}ms`;
      card.innerHTML = `
        <div class="course-top">
          <div>
            <div class="course-title">${escapeHtml(c.title)}</div>
            <div class="course-instructor">by ${escapeHtml(c.instructor)}</div>
          </div>
          <span class="price-tag">EGP ${c.price}</span>
        </div>
        <div>${categoryPillHtml(c.category)}</div>
        <div class="course-meta">
          <div class="course-meta-left">
            ${levelDotsHtml(c.level)}
            <span>·</span>
            <span>${escapeHtml(c.duration || '')}</span>
          </div>
        </div>
        <div class="course-footer">
          ${isEnrolled
            ? `<span class="enrolled-chip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>Enrolled</span>`
            : `<button class="btn btn-primary btn-block enroll-btn"><span class="spinner"></span><span class="btn-label">Enroll now</span></button>`
          }
        </div>
      `;
      if (!isEnrolled) {
        card.querySelector('.enroll-btn').addEventListener('click', (e) => enrollCourse(c.title, e.currentTarget));
      }
      container.appendChild(card);
    });
  }

  function applyFilters(courses) {
    const search = document.getElementById('search-title').value.toLowerCase();
    const category = document.getElementById('filter-category').value;
    const maxPrice = document.getElementById('max-price').value;
    return courses.filter(c => {
      const matchTitle = c.title.toLowerCase().includes(search);
      const matchCategory = category === '' || c.category === category;
      const matchPrice = maxPrice === '' || c.price <= Number(maxPrice);
      return matchTitle && matchCategory && matchPrice;
    });
  }
  function filterCourses() { displayCourses(applyFilters(allCourses)); }
  function clearFilters() {
    document.getElementById('search-title').value = '';
    document.getElementById('filter-category').value = '';
    document.getElementById('max-price').value = '';
    displayCourses(allCourses);
  }

  fetchCourses();
</script>
</body>
</html>
