<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillHub — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .stats-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:14px; margin:28px 0 8px; }
  .stat-card{ padding:18px 20px; }
  .stat-card .stat-label{ font-size:12.5px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .stat-card .stat-value{ font-family:var(--font-display); font-size:28px; margin-top:6px; }
  .stat-card .stat-icon{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }

  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin:30px 0 22px; }
  .tab-btn{
    background:none; border:none; padding:11px 4px; margin-right:22px; font-size:14.5px; font-weight:600;
    color:var(--ink-soft); cursor:pointer; position:relative; top:1px; border-bottom:2px solid transparent;
  }
  .tab-btn.active{ color:var(--brand); border-bottom-color:var(--brand); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .course-form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  .course-form-grid .field.full{ grid-column:1/-1; }
  @media (max-width:600px){ .course-form-grid{ grid-template-columns:1fr; } }
  .form-actions{ display:flex; gap:10px; margin-top:4px; grid-column:1/-1; }
  .form-actions .btn{ flex:1; }

  .section-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .section-title-row h3{ font-size:17px; }

  .action-icon-btn{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    color:var(--ink-soft); transition:.15s ease;
  }
  .action-icon-btn:hover{ border-color:var(--border-strong); color:var(--ink); }
  .action-icon-btn.danger:hover{ background:var(--red-soft); color:var(--red); border-color:var(--red); }
  .action-icon-btn.edit:hover{ background:var(--brand-soft); color:var(--brand); border-color:var(--brand); }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="admin-dashboard.html">
        <span class="brand-mark">◆</span> SkillHub <span class="brand-sub">admin</span>
      </a>
      <div class="nav-actions">
        <button class="btn btn-icon btn-ghost" onclick="toggleTheme()" aria-label="Toggle theme" data-theme-icon></button>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Log out</button>
      </div>
    </div>
  </div>

  <div class="container" style="flex:1; padding-bottom:60px;">
    <div style="margin-top:32px;">
      <h1 style="font-size:26px;">Admin dashboard</h1>
      <p class="muted" style="margin-top:4px;">Manage the course catalog and your learner accounts.</p>
    </div>

    <div class="stats-row">
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--brand-soft); color:var(--brand);">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 4.5A2.5 2.5 0 016.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15z"/></svg>
        </div>
        <div class="stat-label">Courses</div>
        <div class="stat-value" id="stat-courses">—</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--amber-soft); color:var(--amber);">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        </div>
        <div class="stat-label">Learners</div>
        <div class="stat-value" id="stat-users">—</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--green-soft); color:var(--green);">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="stat-label">Enrollments</div>
        <div class="stat-value" id="stat-enrollments">—</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--red-soft); color:var(--red);">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7z"/></svg>
        </div>
        <div class="stat-label">Admins</div>
        <div class="stat-value" id="stat-admins">—</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-btn-courses" onclick="switchTab('courses')">Courses</button>
      <button class="tab-btn" id="tab-btn-users" onclick="switchTab('users')">Users &amp; roles</button>
    </div>

    <!-- COURSES TAB -->
    <div class="tab-panel active" id="panel-courses">
      <div class="card card-pad" style="margin-bottom:24px;">
        <div class="section-title-row">
          <h3 id="form-heading">Add a new course</h3>
        </div>
        <form id="course-form" class="course-form-grid">
          <input type="hidden" id="course-id">
          <div class="field">
            <label for="title">Course title</label>
            <input class="input" type="text" id="title" placeholder="e.g. React From Scratch" required>
          </div>
          <div class="field">
            <label for="instructor">Instructor</label>
            <input class="input" type="text" id="instructor" placeholder="e.g. Sara Mohamed" required>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select class="input" id="category" required>
              <option value="">Select category</option>
              <option value="Programming">Programming</option>
              <option value="Cyber Security">Cyber Security</option>
              <option value="Backend">Backend</option>
              <option value="Frontend">Frontend</option>
              <option value="Database">Database</option>
              <option value="Web">Web</option>
              <option value="Design">Design</option>
            </select>
          </div>
          <div class="field">
            <label for="price">Price (EGP)</label>
            <input class="input" type="number" id="price" placeholder="e.g. 199" required min="0">
          </div>
          <div class="field full" style="max-width:calc(50% - 8px)">
            <label for="level">Level</label>
            <select class="input" id="level" required>
              <option value="">Select level</option>
              <option value="Beginner">Beginner</option>
              <option value="Intermediate">Intermediate</option>
              <option value="Expert">Expert</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-ghost hidden" id="cancel-edit-btn" onclick="resetCourseForm()">Cancel</button>
            <button type="submit" class="btn btn-primary" id="save-course-btn">
              <span class="spinner"></span><span class="btn-label">Save course</span>
            </button>
          </div>
        </form>
      </div>

      <div class="section-title-row">
        <h3>Manage courses</h3>
        <span class="muted" id="courses-count" style="font-size:13px;"></span>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Title</th><th>Category</th><th>Level</th><th>Price</th><th></th></tr>
          </thead>
          <tbody id="courses-table-body"></tbody>
        </table>
      </div>
    </div>

    <!-- USERS TAB -->
    <div class="tab-panel" id="panel-users">
      <div class="section-title-row">
        <h3>Users &amp; roles</h3>
        <span class="muted" id="users-count" style="font-size:13px;"></span>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Name</th><th>Email</th><th>Phone</th><th>Enrolled</th><th>Role</th><th></th></tr>
          </thead>
          <tbody id="users-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
  const user = requireUser();
  if (user && user.role !== 'admin') window.location.href = 'index.html';

  function switchTab(tab) {
    document.getElementById('panel-courses').classList.toggle('active', tab === 'courses');
    document.getElementById('panel-users').classList.toggle('active', tab === 'users');
    document.getElementById('tab-btn-courses').classList.toggle('active', tab === 'courses');
    document.getElementById('tab-btn-users').classList.toggle('active', tab === 'users');
  }

  let isEditing = false;
  let coursesCache = [];
  let usersCache = [];

  function updateStats() {
    document.getElementById('stat-courses').textContent = coursesCache.length;
    document.getElementById('stat-users').textContent = usersCache.length;
    document.getElementById('stat-admins').textContent = usersCache.filter(u => u.role === 'admin').length;
    document.getElementById('stat-enrollments').textContent = usersCache.reduce((sum, u) => sum + (u.enrolledCourses ? u.enrolledCourses.length : 0), 0);
  }

  /* ---------------- Courses ---------------- */
  async function fetchCourses() {
    try {
      const res = await fetch(`${API_BASE}/courses`);
      const data = await res.json();
      coursesCache = data.data.courses;
      renderCourses(coursesCache);
      updateStats();
    } catch (err) {
      console.error('Error fetching courses:', err);
      toast('Could not load courses.', 'error');
    }
  }

  function renderCourses(courses) {
    document.getElementById('courses-count').textContent = `${courses.length} total`;
    const tbody = document.getElementById('courses-table-body');
    tbody.innerHTML = '';
    if (courses.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="muted" style="text-align:center; padding:30px;">No courses yet — add your first one above.</td></tr>`;
      return;
    }
    courses.forEach(c => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><div style="font-weight:600">${escapeHtml(c.title)}</div><div class="muted" style="font-size:12.5px">${escapeHtml(c.instructor)}</div></td>
        <td>${categoryPillHtml(c.category)}</td>
        <td><span class="pill" style="background:var(--brand-soft); color:var(--brand);">${escapeHtml(c.level || 'Beginner')}</span></td>
        <td><span class="price-tag">EGP ${c.price}</span></td>
        <td>
          <div class="row gap-8">
            <button type="button" class="action-icon-btn edit" title="Edit" data-edit>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
            </button>
            <button type="button" class="action-icon-btn danger" title="Delete" data-delete>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg>
            </button>
          </div>
        </td>
      `;
      tr.querySelector('[data-edit]').addEventListener('click', () => editCourse(c));
      tr.querySelector('[data-delete]').addEventListener('click', () => deleteCourse(c._id, c.title));
      tbody.appendChild(tr);
    });
}

  document.getElementById('course-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('course-id').value;
    const saveBtn = document.getElementById('save-course-btn');
    const payload = {
      title: document.getElementById('title').value,
      instructor: document.getElementById('instructor').value,
      category: document.getElementById('category').value,
      price: Number(document.getElementById('price').value),
      level: document.getElementById('level').value,
      duration: "10 hours",
      rating: 5.0,
      students: 100
    };

    const url = isEditing ? `${API_BASE}/courses/${id}` : `${API_BASE}/courses`;
    const method = isEditing ? 'PATCH' : 'POST';

    setButtonLoading(saveBtn, true);
    try {
      const response = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (data.status === 'success') {
        toast(isEditing ? 'Course updated' : 'Course added', 'success');
        resetCourseForm();
        fetchCourses();
      } else {
        toast(data.message || 'Failed to save course', 'error');
      }
    } catch (err) {
      console.error('Error saving course:', err);
      toast('Could not reach the server.', 'error');
    } finally {
      setButtonLoading(saveBtn, false);
    }
  });

  function editCourse(c) {
    isEditing = true;
    document.getElementById('course-id').value = c._id;
    document.getElementById('title').value = c.title;
    document.getElementById('instructor').value = c.instructor;
    document.getElementById('category').value = c.category;
    document.getElementById('price').value = c.price;
    document.getElementById('level').value = c.level;
    document.getElementById('form-heading').textContent = 'Edit course';
    document.getElementById('save-course-btn').querySelector('.btn-label').textContent = 'Update course';
    document.getElementById('cancel-edit-btn').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetCourseForm() {
    document.getElementById('course-form').reset();
    document.getElementById('course-id').value = '';
    isEditing = false;
    document.getElementById('form-heading').textContent = 'Add a new course';
    document.getElementById('save-course-btn').querySelector('.btn-label').textContent = 'Save course';
    document.getElementById('cancel-edit-btn').classList.add('hidden');
  }

  async function deleteCourse(id, title) {
    const ok = await confirmDialog({
      title: 'Delete this course?',
      message: `"${title}" will be permanently removed from the catalog.`,
      confirmLabel: 'Delete course'
    });
    if (!ok) return;
    try {
      await fetch(`${API_BASE}/courses/${id}`, { method: 'DELETE' });
      toast('Course deleted', 'success');
      fetchCourses();
    } catch (err) {
      console.error('Error deleting course:', err);
      toast('Could not delete the course.', 'error');
    }
  }

  /* ---------------- Users ---------------- */
  async function fetchUsers() {
    try {
      const res = await fetch(`${API_BASE}/auth/users`);
      const data = await res.json();
      usersCache = data.data.users;
      renderUsers(usersCache);
      updateStats();
    } catch (err) {
      console.error('Error fetching users:', err);
      toast('Could not load users.', 'error');
    }
  }

  function renderUsers(users) {
    document.getElementById('users-count').textContent = `${users.length} total`;
    const tbody = document.getElementById('users-table-body');
    tbody.innerHTML = '';
    users.forEach(u => {
      const enrolledList = u.enrolledCourses && u.enrolledCourses.length > 0 ? u.enrolledCourses.join(', ') : 'No courses yet';
      const isSelf = user && u.id === user.id;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><div class="cell-name">${avatarHtml(u, 30)} ${escapeHtml(u.name)}</div></td>
        <td class="muted">${escapeHtml(u.email)}</td>
        <td class="muted">${escapeHtml(u.phone || '—')}</td>
        <td><strong>${u.enrolledCourses ? u.enrolledCourses.length : 0}</strong> <span class="muted" style="font-size:12.5px">(${escapeHtml(enrolledList)})</span></td>
        <td><span class="pill ${u.role === 'admin' ? 'role-admin' : 'role-user'}">${u.role}</span></td>
        <td>
          <div class="row gap-8">
            <button type="button" class="btn btn-sm btn-subtle" data-toggle-role>${u.role === 'admin' ? 'Make user' : 'Make admin'}</button>
            <button type="button" class="action-icon-btn danger" title="Delete user" data-delete-user ${isSelf ? 'disabled' : ''}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg>
            </button>
          </div>
        </td>
      `;
      tr.querySelector('[data-toggle-role]').addEventListener('click', (e) => toggleRole(u.id, e.currentTarget));
      const delBtn = tr.querySelector('[data-delete-user]');
      if (!isSelf) delBtn.addEventListener('click', () => deleteUserAccount(u.id, u.name));
      tbody.appendChild(tr);
    });
  }

  async function toggleRole(id, btn) {
    setButtonLoading(btn, true);
    try {
      await fetch(`${API_BASE}/auth/users/${id}/role`, { method: 'PATCH' });
      toast('Role updated', 'success');
      fetchUsers();
    } catch (err) {
      console.error('Error toggling role:', err);
      toast('Could not update role.', 'error');
      setButtonLoading(btn, false);
    }
  }

  async function deleteUserAccount(id, name) {
    const ok = await confirmDialog({
      title: 'Delete this user?',
      message: `${name}'s account will be permanently removed.`,
      confirmLabel: 'Delete user'
    });
    if (!ok) return;
    try {
      const response = await fetch(`${API_BASE}/auth/users/${id}`, { method: 'DELETE' });
      const result = await response.json();
      if (result.status === 'success') {
        toast('User deleted', 'success');
        fetchUsers();
      } else {
        toast(result.message || 'Failed to delete user', 'error');
      }
    } catch (err) {
      console.error('Error deleting user:', err);
      toast('Could not reach the server.', 'error');
    }
  }

  fetchCourses();
  fetchUsers();
</script>
</body>
</html>
