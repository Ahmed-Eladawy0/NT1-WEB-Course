<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillHub — My Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .profile-wrap{ max-width:520px; margin:40px auto 60px; }
  .avatar-zone{
    display:flex; flex-direction:column; align-items:center; gap:12px;
    padding:28px 24px 22px; border-bottom:1px solid var(--border);
  }
  .avatar-big{
    width:96px; height:96px; border-radius:50%; object-fit:cover;
    border:3px solid var(--surface); box-shadow:0 0 0 3px var(--brand-soft);
    background:linear-gradient(135deg, var(--brand), #8B7CF6);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:32px; font-weight:700; overflow:hidden;
  }
  .avatar-big img{ width:100%; height:100%; object-fit:cover; }
  .avatar-actions{ display:flex; gap:8px; align-items:center; }
  .avatar-actions input[type=file]{ display:none; }
  .form-body{ padding:24px; }
  .readonly-hint{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .save-bar{ display:flex; gap:10px; margin-top:6px; }
  .save-bar .btn{ flex:1; }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="user-dashboard.html">
        <span class="brand-mark">◆</span> SkillHub <span class="brand-sub">learner</span>
      </a>
      <div class="nav-actions">
        <button class="btn btn-icon btn-ghost" onclick="toggleTheme()" aria-label="Toggle theme" data-theme-icon></button>
        <button class="btn btn-ghost btn-sm" onclick="window.location.href='user-dashboard.html'">← Back to dashboard</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="profile-wrap card fade-up">
      <div class="avatar-zone">
        <div class="avatar-big" id="avatar-preview"></div>
        <div class="avatar-actions">
          <label class="btn btn-subtle btn-sm" for="avatar-file" style="cursor:pointer;">
            Change photo
            <input type="file" id="avatar-file" accept="image/*">
          </label>
        </div>
        <span class="readonly-hint">JPG or PNG — shown to admins across the platform</span>
      </div>

      <form id="profile-form" class="form-body">
        <div class="field">
          <label for="name">Full name</label>
          <input class="input" type="text" id="name" required>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input class="input" type="email" id="email" disabled>
          <div class="readonly-hint">Email can't be changed here.</div>
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input class="input" type="text" id="phone" placeholder="e.g. 010 1234 5678">
        </div>
        <div class="save-bar">
          <button type="submit" class="btn btn-primary" id="save-btn">
            <span class="spinner"></span><span class="btn-label">Save changes</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
  const user = requireUser();
  let base64Image = (user && user.avatar) || '';

  function renderAvatar() {
    const el = document.getElementById('avatar-preview');
    if (base64Image) {
      el.innerHTML = `<img src="${base64Image}" alt="">`;
    } else {
      el.textContent = initials(user ? user.name : '');
    }
  }

  if (user) {
    document.getElementById('name').value = user.name || '';
    document.getElementById('email').value = user.email || '';
    document.getElementById('phone').value = user.phone || '';
    renderAvatar();
  }

  document.getElementById('avatar-file').addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      toast('Please choose an image file.', 'error');
      return;
    }
    const reader = new FileReader();
    reader.onload = function (event) {
      base64Image = event.target.result;
      renderAvatar();
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const saveBtn = document.getElementById('save-btn');
    const updatedData = {
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      avatar: base64Image
    };

    setButtonLoading(saveBtn, true);
    try {
      const res = await fetch(`${API_BASE}/auth/users/${user.id}/profile`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(updatedData)
      });
      const data = await res.json();

      if (data.status === 'success') {
        localStorage.setItem('user', JSON.stringify(data.data.user));
        toast('Profile updated successfully!', 'success', 1200);
        setTimeout(() => window.location.href = 'user-dashboard.html', 400);
      } else {
        toast(data.message || 'Failed to update profile', 'error');
      }
    } catch (err) {
      console.error('Error updating profile:', err);
      toast('Could not reach the server. Is the backend running?', 'error');
    } finally {
      setButtonLoading(saveBtn, false);
    }
  });
</script>
</body>
</html>
